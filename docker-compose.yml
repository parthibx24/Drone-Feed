services:
  drone-feed:
    build: .
    container_name: drone-feed
    restart: unless-stopped
    ports:
      - "${VIEWER_PORT:-8091}:8091"
    env_file:
      - .env
    environment:
      - AGENT_PORT=${AGENT_PORT:-8080}
      - GO2RTC_URL=${GO2RTC_URL:-https://cams.drone.starwatch.bb7fab11.sslip.io}
      - VIEWER_HOST=0.0.0.0
      - VIEWER_PORT=8091
