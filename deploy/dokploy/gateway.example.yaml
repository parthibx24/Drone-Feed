# gateway.yaml for the Dokploy deployment. Paste into Dokploy as a File Mount
# with path "gateway.yaml" (Advanced -> Mounts). Full reference:
# deploy/server/gateway.example.yaml and docs/03-drone-gateway.md.
# ${VAR} is replaced from the dashboard container's environment.

listen: ":8091"
web_dir: /app/web
recordings_dir: /recordings

auth:
  session_secret: ${SESSION_SECRET}
  session_ttl: 12h
  users:
    # One entry per person. role: operator (can fly) or viewer (watch only).
    # Create the hash with: drone-gateway hash-password (see README.md).
    - username: admin
      password_hash: "REPLACE-WITH-BCRYPT-HASH"
      role: operator

go2rtc:
  public_url: https://cams.drone.starwatch.bb7fab11.sslip.io
  api_url: http://127.0.0.1:1984     # same network namespace as go2rtc
  rtsp_url: rtsp://127.0.0.1:8554
  ingest_mode: mp4

gcs_system_id: 255
gcs_component_id: 190
telemetry_hz: 5
limits: { max_alt_m: 120, max_speed_m_s: 15, max_mission_items: 500 }
allow_raw_commands: false

drones:
  - id: kotowali
    name: Kotowali Thana SMP
    mavlink: udp:100.111.237.109:14560        # star9's Tailscale IP, mavlink-router endpoint
    stream_prefix: Kotowali-Thana-SMP          # go2rtc streams Kotowali-Thana-SMP_camera / _thermal
  # Shahporan needs mavlink-router on its Pi first (docs/05-deployment.md §3):
  # - id: shahporan
  #   name: Shahporan Thana SMP
  #   mavlink: udp:100.115.37.32:14560
  #   stream_prefix: Shahporan-Thana-SMP

# AI detection (docs/09-ai.md). Remove alerts / auto_record / vision to turn
# those features off.
ai:
  enabled: true
  ingest_token: ${AI_INGEST_TOKEN}
  run_when: auto            # only while a drone is armed or someone watches it
  fps: 3
  min_confidence: 0.35
  # camera: { visible_hfov_deg: 62, thermal_hfov_deg: 42 }   # set the C12's real values
  alerts:
    labels: [person]
    cooldown_s: 120
    telegram: { bot_token: "${TELEGRAM_BOT_TOKEN}", chat_id: "REPLACE-WITH-CHAT-ID" }
  auto_record:
    labels: [person]
    stop_after_s: 30
  vision:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-opus-5-5
    effort: medium
