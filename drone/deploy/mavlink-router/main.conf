# mavlink-router configuration for a drone Pi (star9 and its siblings).
# Installed to /etc/mavlink-router/main.conf. Replaces MAVProxy.
#
# Flight controller (serial) <-> every endpoint below. mavlink-router routes by
# target system/component, so commands reach only the component they address.

[General]
# TCP server for ad-hoc ground stations (QGC / Mission Planner): tcp://<pi>:14551
# Same port MAVProxy used, so existing GCS bookmarks keep working.
TcpServerPort = 14551
ReportStats = false
MavlinkDialect = ardupilotmega

# Telemetry log (.tlog) on the SD card, only while armed, auto-pruned.
# Unlike the old MAVProxy setup this is on disk, not in RAM (/tmp).
Log = /home/dronepi/flightlogs
LogMode = while-armed
LogTelemetry = true
MaxLogFiles = 100
MinFreeSpace = 2000000000

[UartEndpoint flightcontroller]
Device = /dev/ttyAMA0
Baud = 115200

# drone-gateway on the central server connects here (it sends first, we reply).
# Restrict who can reach this port with Tailscale ACLs.
[UdpEndpoint gateway]
Mode = Server
Address = 0.0.0.0
Port = 14560

# gimbal-bridge on this Pi (camera = component 100, gimbal = component 154).
[UdpEndpoint gimbal-bridge]
Mode = Normal
Address = 127.0.0.1
Port = 14556

# Legacy: the old Python drone-agent listens here. Keep while Drone-Feed still
# uses it; harmless once it is gone.
[UdpEndpoint legacy-agent]
Mode = Normal
Address = 127.0.0.1
Port = 14550

# Legacy: QGroundControl PC (desktop-l46elam-1), as in the old MAVProxy unit.
# Remove once nobody relies on it; GCS users can connect to TCP 14551 instead.
[UdpEndpoint qgc-desktop]
Mode = Normal
Address = 100.125.176.95
Port = 14550
