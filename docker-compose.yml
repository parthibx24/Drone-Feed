# Local development / single-host run. The production server uses the central
# StarWatch docker-compose (see docs/05-deployment.md).
services:
  starwatch:
    build: .
    container_name: starwatch
    restart: unless-stopped
    ports:
      - "8091:8091"
    env_file:
      - .env
    volumes:
      - ./gateway.yaml:/config/gateway.yaml:ro
      - recordings:/recordings

volumes:
  recordings:
